server:
  port: ${PORT:8080}
spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: identity
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
erp:
  jwt:
    secret: ${JWT_SECRET}
  audit:
    url: ${AUDIT_URL:http://audit:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
