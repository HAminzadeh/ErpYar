name: Phase 00 baseline quality gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Values exist only to parse Compose interpolation; no containers started.
      JWT_SECRET: ci-validation-placeholder-not-a-production-secret-1234567890
      DB_PASSWORD: ci-compose-validation-placeholder
      BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-placeholder-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify baseline structure
        run: python3 scripts/verify_baseline.py
      - name: Test baseline checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Verify Maven reactor and unit tests
        run: mvn -B -ntp verify
      - name: Validate Compose file without starting containers
        run: docker compose config --quiet
