name: erp-phase1
x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: erp
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  AUDIT_URL: http://audit:8080
x-build-common: &build-common
  context: .
  dockerfile: Dockerfile
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  gateway:
    build: {context: ., dockerfile: Dockerfile, args: {MODULE: gateway}}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      identity: {condition: service_started}
      organization: {condition: service_started}
      master-data: {condition: service_started}
      workflow: {condition: service_started}
      notification: {condition: service_started}
      audit: {condition: service_started}
    restart: unless-stopped
  identity:
    build: {context: ., dockerfile: Dockerfile, args: {MODULE: identity}}
    environment:
      <<: *app-env
      DB_NAME: identity_db
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  organization:
    build: {context: ., dockerfile: Dockerfile, args: {MODULE: organization}}
    environment:
      <<: *app-env
      DB_NAME: organization_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  master-data:
    build: {context: ., dockerfile: Dockerfile, args: {MODULE: master-data}}
    environment:
      <<: *app-env
      DB_NAME: master_data_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  workflow:
    build: {context: ., dockerfile: Dockerfile, args: {MODULE: workflow}}
    environment:
      <<: *app-env
      DB_NAME: workflow_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  notification:
    build: {context: ., dockerfile: Dockerfile, args: {MODULE: notification}}
    environment:
      <<: *app-env
      DB_NAME: notification_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  audit:
    build: {context: ., dockerfile: Dockerfile, args: {MODULE: audit}}
    environment:
      <<: *app-env
      DB_NAME: audit_db
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
